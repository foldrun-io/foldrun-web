# A stand-in for the Anthropic Messages API, for the quality stack: every
# call answers "QUALITY-OK" at once (/model/...), or after a delay
# (/slow-model/<ms>/... — what the chaos test kills a run in the middle of).
# No tokens are spent and nothing leaves the machine.
load_module modules/ngx_http_js_module.so;
events {}
http {
  access_log off;
  server_tokens off;
  js_import fake from /etc/nginx/fake.js;
  server {
    listen 8080;
    client_max_body_size 8m;
    client_body_buffer_size 8m;
    location ~ ^/model/v1/messages/count_tokens$ { js_content fake.count; }
    location ~ ^/model/v1/messages$ { js_content fake.messages; }
    location ~ ^/slow-model/\d+/v1/messages/count_tokens$ { js_content fake.count; }
    location ~ ^/slow-model/\d+/v1/messages$ { js_content fake.slow; }
    location ~ /v1/models { js_content fake.models; }
    location = /healthz { return 200 "ok"; }
    location / { return 404; }
  }
}
